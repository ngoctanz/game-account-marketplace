name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
        working-directory: FE
      - run: npm run type-check
        working-directory: FE
      - run: npm run build
        working-directory: FE

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find BE/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build production image
        run: docker build BE

  deploy:
    if: github.event_name == 'push'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy backend
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'cd ~/apps/game-account-marketplace &&
             git pull --ff-only origin main &&
             docker compose up -d --build --remove-orphans &&
             curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:3001/v1/health'
