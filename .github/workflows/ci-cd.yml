name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
        working-directory: FE
      - run: npm run type-check
        working-directory: FE
      - run: npm run build
        working-directory: FE

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find BE/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build production image
        run: docker build BE

  deploy:
    if: github.event_name == 'push'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check deploy secrets
        run: |
          test -n "$VPS_SSH_KEY" || { echo "::error::Missing VPS_SSH_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "::error::Missing VPS_KNOWN_HOSTS"; exit 1; }
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy backend
        run: |
          ssh -p 22 tanz@103.211.206.99 'bash -se' <<'SCRIPT'
          cd ~/apps/game-account-marketplace
          previous_commit=$(git rev-parse HEAD)
          git pull --ff-only origin main

          if docker compose up -d --build --remove-orphans &&
             curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:3001/v1/health; then
            exit 0
          fi

          echo "Deployment failed, rolling back to $previous_commit"
          git reset --hard "$previous_commit"
          docker compose up -d --build --remove-orphans
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:3001/v1/health
          exit 1
          SCRIPT
